<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>[NOM DU SITE]</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" id="lien-skip" href="#contenu">Aller au contenu</a>

  <header class="entete">
    <div class="conteneur entete-interne">
      <a class="logo" id="lien-accueil" href="#/">[NOM DU SITE]</a>
      <div class="outils">
        <div class="taille" role="group" aria-labelledby="label-taille">
          <span class="sr-only" id="label-taille">Taille du texte</span>
          <button type="button" id="btn-reduire"><span aria-hidden="true">A−</span><span class="sr-only" id="txt-reduire">Réduire le texte</span></button>
          <button type="button" id="btn-agrandir"><span aria-hidden="true">A+</span><span class="sr-only" id="txt-agrandir">Agrandir le texte</span></button>
        </div>
        <label class="choix-langue">
          <span id="label-langue">Langue</span>
          <select id="select-langue"></select>
        </label>
      </div>
    </div>
  </header>

  <main id="contenu" class="conteneur" tabindex="-1">
    <div id="app"><p>Chargement…</p></div>
    <noscript><p>JavaScript est nécessaire pour afficher ce site.</p></noscript>
  </main>

  <footer class="pied">
    <div class="conteneur"><p id="pied-texte"></p></div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
