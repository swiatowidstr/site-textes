<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>[NOM DU SITE]</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Fenêtre de paiement Lemon Squeezy (les liens d'achat marchent aussi sans ce script) -->
  <script src="https://assets.lemonsqueezy.com/lemon.js" defer></script>
</head>
<body>
  <a class="skip" id="lien-skip" href="#contenu">Aller au contenu</a>
  <div class="progression" id="progression" aria-hidden="true"></div>

  <header class="entete">
    <div class="conteneur entete-interne">
      <a class="logo" id="lien-accueil" href="#/">[NOM DU SITE]</a>
      <nav class="nav-principale" id="nav-principale" aria-label="Navigation principale">
        <a id="nav-livre" href="#/">Le livre</a>
        <a id="nav-chapitres" href="#/">Chapitres</a>
        <a id="nav-boutique" href="#/">Boutique</a>
      </nav>
      <div class="outils">
        <div class="taille" role="group" aria-labelledby="label-taille">
          <span class="sr-only" id="label-taille">Taille du texte</span>
          <button type="button" id="btn-reduire"><span aria-hidden="true">A−</span><span class="sr-only" id="txt-reduire">Réduire le texte</span></button>
          <button type="button" id="btn-agrandir"><span aria-hidden="true">A+</span><span class="sr-only" id="txt-agrandir">Agrandir le texte</span></button>
        </div>
        <label class="choix-langue">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
          <span class="sr-only" id="label-langue">Langue</span>
          <select id="select-langue"></select>
        </label>
      </div>
    </div>
  </header>

  <main id="contenu" class="conteneur" tabindex="-1">
    <div id="app"><p>…</p></div>
    <noscript><p>JavaScript est nécessaire pour afficher ce site.</p></noscript>
  </main>

  <footer class="pied">
    <div class="conteneur pied-interne">
      <p id="pied-texte"></p>
      <a id="lien-mentions" href="#/">Mentions légales</a>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
